<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        table{
            border-collapse: collapse;
            text-align: left;
            font-family: Arial, Helvetica, sans-serif;
        }

        th,td {    
            padding: 10px;
            border: 2px solid black;
            width: 140px;
            font-size: 1.5em;
        }

        .center{
            text-align: center;
            font-weight: bolder;
        }

        .destaque {
            background-color: gray;
            color: white;text-align: center;
        }

        .mediaG{
            text-align: left;
            background-color: gray;
            color: white;
        }
        
    </style>
</head>
<body>
    <table>
        <tr>
            <th class="destaque"  rowspan="2">Área</th>
            <th class="destaque"  rowspan="2">Disciplinas</th>
            <th class="destaque"  colspan="2">Notas</th>
            <th class="destaque"  rowspan="2">Média</th>
        </tr>
        <tr>
            <th class="destaque"  >Nota 1</th>
            <th class="destaque"  >Nota 2</th>
        </tr>
        <tr>
            <th class="center" rowspan="4">Exatas</th>
            <td>Matemática</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
        </tr>
        <tr>
            <td>Física</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
        </tr>
        <tr>
            <td>Química</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
        </tr>
        <tr>
            <th class="mediaG" colspan="4">Média Exatas</th>
            <td class="destaque" >0.0</td>
        </tr>
        <tr>
            <th class="center" rowspan="2">Humanas</th>
            <td>História</td>
            <td class="center">0.0</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
            <td class="center" >0.0</td>
        </tr>
        <tr>
            <th class="mediaG" colspan="4">Média Humanas</th>
            <td class="destaque" >0.0</td>
        </tr>
    </table>
</body>
</html>
