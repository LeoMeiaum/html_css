<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="iest" >Estado</label>
            <select name="estado" id="iestado">
                <optgroup label="região 1">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão: </label>
            <input type="text" name="prof" id="iprof" list="istprof">
            <datalist id="istprof">
            <option value="ADN"></option>
            <option value="Contador"></option>
            <option value="DEV"></option>
        </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Sua mensagem aqui:"></textarea>

        </p>

        <p>
            <input type="submit" value="ENVIAR">
            <input type="reset" value="RSETAR">
        </p>
    </form>
</body>
</html>
