<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Teste de formulário.</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required maxlength="30" minlength="4" placeholder="Nome completo" autocomplete="name">
        </p>

        <p>
            <label for="idia">Dia da prova: </label>
            <input type="date" name="dia" id="idia">
        </p>

        <p>
            <label for="ihora">Horário da prova: </label>
            <input type="time" >
        </p>

        <p>
            <label for="imedia">Média: </label>
            <input type="number" name="media" id="imedia" max="10" min="0" placeholder="0 a 10" step="0,5" autocomplete="off">
        </p>

        <p>
            <label for="imes">Período letivo: </label>
            <input type="month" name="mes" id="imes" value="2025-9">
        </p>

        <p>
        <input type="submit" value="ENVIAR">
        <input type="reset" value="LIMPAR">
        </p>


    </form>
</body>
</html>
